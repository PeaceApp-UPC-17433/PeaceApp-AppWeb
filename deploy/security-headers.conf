add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
# CSP (hallazgo de ZAP 10038). Orígenes de terceros que usa el navegador:
# - Mapbox GL: estilos, tiles y telemetría; crea su worker desde un blob: (worker-src/child-src blob:).
# - Cloudinary: subida de la foto de perfil (api) y su lectura (res).
# - Azure Blob: subida de evidencias con SAS y su lectura.
# style-src necesita 'unsafe-inline': Vue y mapbox-gl escriben atributos style. No hay scripts en línea.
# HSTS lo agrega el ingress con TLS; aquí no aplica porque nginx sirve HTTP detrás del ingress.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://*.blob.core.windows.net https://api.mapbox.com; font-src 'self' data:; connect-src 'self' https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://api.cloudinary.com https://*.blob.core.windows.net; worker-src 'self' blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
